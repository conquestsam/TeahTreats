name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Build Before Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm --filter @snacks/shared build
      - run: pnpm --filter @snacks/shared test
      - run: pnpm --filter @snacks/api typecheck
      - run: pnpm --filter @snacks/api build
      - run: pnpm --filter @snacks/api test
      - run: pnpm --filter @snacks/web typecheck
      - run: pnpm --filter @snacks/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:4000/api/v1' }}
          NEXT_PUBLIC_TEMP_TENANT_ID: ${{ vars.NEXT_PUBLIC_TEMP_TENANT_ID || 'platform' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

  deploy-database-migrations:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    needs:
      - verify
    if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  deploy-web:
    name: Deploy Web To Vercel
    runs-on: ubuntu-latest
    needs:
      - verify
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snacks/shared build
      - run: pnpm --filter @snacks/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_TEMP_TENANT_ID: ${{ vars.NEXT_PUBLIC_TEMP_TENANT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Deploy web
        run: pnpm dlx vercel deploy --prod --token "$VERCEL_TOKEN" --cwd apps/web --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-render-api:
    name: Deploy API To Render
    runs-on: ubuntu-latest
    needs:
      - deploy-web
      - deploy-database-migrations
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_RENDER_DEPLOY == 'true' }}
    environment: production
    steps:
      - name: Trigger Render API deploy hook
        run: |
          test -n "$RENDER_API_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

  deploy-render-worker:
    name: Deploy Worker To Render
    runs-on: ubuntu-latest
    needs: deploy-render-api
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_RENDER_DEPLOY == 'true' }}
    environment: production
    steps:
      - name: Trigger Render worker deploy hook
        run: |
          test -n "$RENDER_WORKER_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK_URL"
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}

  deploy-server:
    name: Deploy API And Worker To Server
    runs-on: ubuntu-latest
    needs:
      - verify
      - deploy-database-migrations
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_SERVER_DEPLOY == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create pre-deploy database backup
        id: pre-deploy-backup
        run: |
          set -euo pipefail
          backup_name="$(
            ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
              "APP_DIR='$APP_DIR' COMPOSE_FILE='$COMPOSE_FILE' bash -s" <<'REMOTE'
                set -euo pipefail
                cd "$APP_DIR"
                test -f .env
                mkdir -p backups
                timestamp="$(date -u +%Y%m%d-%H%M%S)"
                backup_file="backups/predeploy-${timestamp}.sql.gz"
                docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" exec -T postgres \
                  sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U "${POSTGRES_USER:-snacks}" -d "${POSTGRES_DB:-snacks_commerce}" --no-owner --no-privileges' \
                  | gzip -9 > "$backup_file"
                test -s "$backup_file"
                basename "$backup_file"
          REMOTE
          )"
          echo "backup_name=${backup_name}" >> "$GITHUB_OUTPUT"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.SERVER_APP_DIR }}
          COMPOSE_FILE: ${{ vars.SERVER_COMPOSE_FILE || 'docker-compose.prod.yml' }}

      - name: Pull latest code and deploy compose services
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' COMPOSE_FILE='$COMPOSE_FILE' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" up -d postgres redis opensearch
            docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" build api
            docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" --profile migrate run --rm migrate
            docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" up -d api worker
            docker compose --env-file .env -f "${COMPOSE_FILE:-docker-compose.prod.yml}" exec -T api wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null
            docker image prune -f
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.SERVER_APP_DIR }}
          COMPOSE_FILE: ${{ vars.SERVER_COMPOSE_FILE || 'docker-compose.prod.yml' }}

      - name: Notify Telegram on deploy success
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram deploy notification skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=TeshTreats deploy succeeded for ${GITHUB_SHA}. Pre-deploy backup: ${BACKUP_NAME}."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_NAME: ${{ steps.pre-deploy-backup.outputs.backup_name }}

      - name: Notify Telegram on deploy failure
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram deploy notification skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=TeshTreats deploy failed for ${GITHUB_SHA}. Check GitHub Actions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
