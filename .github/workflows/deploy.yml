name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-database-migrations:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  deploy-web:
    name: Deploy Web To Vercel
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snacks/shared build
      - run: pnpm --filter @snacks/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_TENANT_ID: ${{ vars.NEXT_PUBLIC_TENANT_ID }}
      - name: Deploy web
        run: pnpm dlx vercel deploy --prod --token "$VERCEL_TOKEN" --cwd apps/web --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-render-api:
    name: Deploy API To Render
    runs-on: ubuntu-latest
    needs:
      - deploy-web
      - deploy-database-migrations
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_RENDER_DEPLOY == 'true' }}
    environment: production
    steps:
      - name: Trigger Render API deploy hook
        run: |
          test -n "$RENDER_API_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

  deploy-render-worker:
    name: Deploy Worker To Render
    runs-on: ubuntu-latest
    needs: deploy-render-api
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_RENDER_DEPLOY == 'true' }}
    environment: production
    steps:
      - name: Trigger Render worker deploy hook
        run: |
          test -n "$RENDER_WORKER_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK_URL"
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}

  deploy-server:
    name: Deploy API And Worker To Server
    runs-on: ubuntu-latest
    needs:
      - deploy-database-migrations
    if: ${{ always() && !failure() && !cancelled() && vars.ENABLE_SERVER_DEPLOY == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull latest code and deploy compose services
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            corepack enable
            pnpm install --frozen-lockfile
            pnpm db:generate
            pnpm db:deploy
            docker compose -f docker-compose.prod.yml up -d --build api worker
            docker image prune -f
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.SERVER_APP_DIR }}
