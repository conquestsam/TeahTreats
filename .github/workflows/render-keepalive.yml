name: Render Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_RENDER_KEEPALIVE == 'true' }}
    steps:
      - name: Ping API health endpoint
        run: |
          set -euo pipefail
          test -n "$KEEPALIVE_URL"
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 "$KEEPALIVE_URL"
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
