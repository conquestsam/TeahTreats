services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snacks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-snacks_commerce}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-snacks} -d $${POSTGRES_DB:-snacks_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is required}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: snacks-api:latest
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-snacks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snacks_commerce}?schema=public
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
    ports:
      - "${API_PUBLIC_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  worker:
    image: snacks-api:latest
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-snacks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snacks_commerce}?schema=public
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
    command: ["pnpm", "--filter", "@snacks/api", "start:worker"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  migrate:
    image: snacks-api:latest
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-snacks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snacks_commerce}?schema=public
    command: ["pnpm", "db:deploy"]
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  opensearch-data:

networks:
  backend:
    driver: bridge
